name: Build and Deploy Flask App

on:
  pull_request:
    branches:
      - Dev
    types:
      - closed

jobs:

  build-and-push:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set Image Tag
      run: echo "IMAGE_TAG=$(echo ${{ github.event.pull_request.merge_commit_sha }} | cut -c1-7)" >> $GITHUB_ENV


    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/player-registration-app:$IMAGE_TAG .

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/player-registration-app:$IMAGE_TAG

  deploy-to-azure:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: Dev
    
    steps:

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set Image Tag
      run: echo "IMAGE_TAG=$(echo ${{ github.event.pull_request.merge_commit_sha }} | cut -c1-7)" >> $GITHUB_ENV

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: webappservice
        images: ${{ secrets.DOCKER_USERNAME }}/player-registration-app:${{ env.IMAGE_TAG }}