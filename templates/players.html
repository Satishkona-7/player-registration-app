<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Players</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>📋 Registered Players</h1>

    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Sport</th>
            <th>Team</th>
            <th>Email</th>
        </tr>

        {% for player in players %}
        <tr>
            <td>{{ player.name }}</td>
            <td>{{ player.age }}</td>
            <td>{{ player.sport }}</td>
            <td>{{ player.team }}</td>
            <td>{{ player.email }}</td>
        </tr>
        {% endfor %}
    </table>

    <a href="/">← Register Another Player</a>
</div>

</body>
</html>
